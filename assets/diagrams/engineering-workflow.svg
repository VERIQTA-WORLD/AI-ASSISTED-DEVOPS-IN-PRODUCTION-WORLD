<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#68dfb0"/></marker></defs><rect width="1080" height="1350" fill="#071d18"/><text x="65" y="65" font-family="Arial" font-size="29" fill="#68dfb0">VERIQTA / AI-ASSISTED ENGINEERING</text><rect x="65" y="110" width="950" height="80" rx="12" fill="#eff8f4"/><text x="540.0" y="157.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Problem / Evidence</text><rect x="65" y="275" width="450" height="90" rx="12" fill="#eff8f4"/><text x="290.0" y="327.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Redact / Set scope</text><rect x="565" y="275" width="450" height="90" rx="12" fill="#eff8f4"/><text x="790.0" y="327.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Ask AI / Capture response</text><rect x="65" y="450" width="950" height="90" rx="12" fill="#eff8f4"/><text x="540.0" y="502.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Engineer reviews claims, commands, code and uncertainty</text><rect x="65" y="625" width="450" height="90" rx="12" fill="#eff8f4"/><text x="290.0" y="677.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Verify in isolated environment</text><rect x="565" y="625" width="450" height="90" rx="12" fill="#eff8f4"/><text x="790.0" y="677.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Reject / Gather more evidence</text><rect x="65" y="800" width="950" height="90" rx="12" fill="#eff8f4"/><text x="540.0" y="852.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Implement in controlled environment / Test / Failure scenarios</text><rect x="65" y="980" width="450" height="90" rx="12" fill="#eff8f4"/><text x="290.0" y="1032.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Human production approval</text><rect x="565" y="980" width="450" height="90" rx="12" fill="#eff8f4"/><text x="790.0" y="1032.0" text-anchor="middle" font-family="Arial" font-size="19" fill="#153e30">Monitor / Stop / Roll back</text><path d="M290,190 L290,275" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M515,320 L565,320" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M790,365 L790,450" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M290,540 L290,625" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M790,540 L790,625" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M290,715 L290,800" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M290,890 L290,980" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M515,1025 L565,1025" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><path d="M1015,670 L1045,670 L1045,230 L790,230 L790,275" fill="none" stroke="#68dfb0" stroke-width="3" marker-end="url(#a)"/><text x="65" y="1180" font-family="Arial" font-size="21" fill="#c6e3d6">AI proposals are inputs to engineering judgment.</text><text x="65" y="1220" font-family="Arial" font-size="21" fill="#c6e3d6">Verification precedes production change. Failed checks stop progression.</text><text x="65" y="1280" font-family="Arial" font-size="22" fill="#68dfb0">The engineer owns authorization and operational decisions.</text></svg>