<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="575" viewBox="0 0 1600 575" role="img" aria-labelledby="title desc"><title id="title">KEEP CONTROL OF THE CHANGE</title><desc id="desc">Protect sensitive data. Verify advice. Limit execution.</desc><rect width="1600" height="575" fill="#071525"/><circle cx="1470" cy="60" r="280" fill="#0c293d"/><path d="M0 0H1600" stroke="#43e5bd" stroke-width="12"/><g font-family="Arial, sans-serif" font-weight="700"><text x="80" y="65" font-size="22" fill="#43e5bd">VERIQTA WORLD</text><text x="80" y="124" font-size="18" fill="#9bb4cc">PRODUCTION PRINCIPLES</text><text x="80" y="195" font-size="54" fill="#f5f9ff">KEEP CONTROL OF THE CHANGE</text><text x="80" y="260" font-size="23" fill="#a9bfd4">Protect sensitive data. Verify advice. Limit execution.</text><rect x="80" y="305" width="340" height="140" rx="18" fill="#102b40" stroke="#24475d"/><text x="104" y="350" font-size="24" fill="#43e5bd">Data boundaries</text><text x="104" y="393" font-size="19" fill="#d9e6f4">Redact and minimise</text><rect x="445" y="305" width="340" height="140" rx="18" fill="#102b40" stroke="#24475d"/><text x="469" y="350" font-size="24" fill="#43e5bd">Review gates</text><text x="469" y="393" font-size="19" fill="#d9e6f4">Test before execution</text><rect x="810" y="305" width="340" height="140" rx="18" fill="#102b40" stroke="#24475d"/><text x="834" y="350" font-size="24" fill="#43e5bd">Recovery</text><text x="834" y="393" font-size="19" fill="#d9e6f4">Know the rollback</text><text x="80" y="540" font-size="17" fill="#738ea6">AI assists. Engineers verify. Production outcomes matter.</text></g></svg>